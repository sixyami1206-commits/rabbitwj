<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大和運輸 - 公式総合サービス</title>
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #002147; --primary-light: #1a3a60; --accent: #f59e0b; --bg: #f8fafc; --card-bg: #ffffff; --text: #1e293b; --text-muted: #64748b; --border: #e2e8f0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans JP', sans-serif; }
        body { background-color: var(--bg); color: var(--text); line-height: 1.6; }
        header { background-color: var(--primary); color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.4rem; font-weight: 700; color: #fff; }
        .logo-badge { background: var(--accent); color: var(--primary); font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; }
        nav { display: flex; gap: 8px; }
        nav button { background: none; border: none; color: #94a3b8; font-size: 0.95rem; font-weight: 500; cursor: pointer; padding: 8px 16px; border-radius: 6px; }
        nav button.active, nav button:hover { color: white; background: var(--primary-light); }
        .container { max-width: 850px; margin: 2rem auto; padding: 0 1rem; }
        .tab-content { display: none; background: var(--card-bg); padding: 2.5rem; border-radius: 12px; border: 1px solid var(--border); }
        .tab-content.active { display: block; }
        h2 { font-size: 1.35rem; color: var(--primary); margin-bottom: 0.5rem; border-bottom: 2px solid var(--border); padding-bottom: 0.5rem; }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; }
        input[type="text"], select { width: 100%; padding: 11px; font-size: 0.95rem; border: 1px solid var(--border); border-radius: 6px; }
        button.btn { background: var(--primary); color: white; border: none; padding: 12px 20px; font-size: 0.95rem; font-weight: 600; border-radius: 6px; cursor: pointer; width: 100%; }
        .btn-red { background: #dc2626; margin-top: 15px; }
        .btn-gray { background: #64748b; margin-top: 10px; }
        .result-card { margin-top: 1.5rem; padding: 1.25rem; border: 1px solid var(--border); border-radius: 8px; background: #f8fafc; }
        .status-badge { display: inline-block; background: #059669; color: white; padding: 4px 10px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; }
        .message-box { margin-top: 12px; padding: 12px; background: #eff6ff; border-left: 4px solid #2563eb; font-size: 0.9rem; border-radius: 0 4px 4px 0; }
        .pdf-container { margin-top: 1.5rem; background: #fff; border: 2px solid #333; box-shadow: 0 4px 10px rgba(0,0,0,0.15); padding: 20px; font-family: 'Yuji Syuku', serif; }
        .pdf-header { text-align: center; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 15px; font-size: 1.3rem; font-weight: bold; }
        .pdf-body { font-size: 1rem; line-height: 1.8; }
        .reason-box { margin: 12px 0; border: 1px solid #666; padding: 10px; background: #fffdfa; }
        .stamp-area { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 15px; border-top: 1px dashed #aaa; padding-top: 12px; }
        .hanko { width: 55px; height: 55px; border: 2px solid #dc2626; border-radius: 50%; color: #dc2626; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: bold; transform: rotate(-10deg); font-family: 'Yuji Syuku', serif; }
        .timeline { margin-top: 1.5rem; border-left: 2px solid #cbd5e1; padding-left: 15px; }
        .timeline-item { margin-bottom: 10px; color: #94a3b8; font-size: 0.88rem; }
        .timeline-item.done { color: #1e293b; font-weight: 500; }
        .timeline-item.current { color: #2563eb; font-weight: 700; }
        .qr-box { text-align: center; background: #fafafa; padding: 15px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 15px; }
        .qr-box img { width: 180px; height: 180px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">大和運輸 <span class="logo-badge">公式</span></div>
        <nav>
            <button id="nav-top" class="active" onclick="showTab('top')">追跡</button>
            <button id="nav-ship" onclick="showTab('ship')">荷物を送る</button>
        </nav>
    </header>

    <div class="container">
        <!-- 追跡タブ -->
        <div id="tab-top" class="tab-content active">
            <h2>お荷物追跡</h2>
            <div style="display:flex; gap:10px; margin-bottom: 1.5rem;">
                <input type="text" id="trackingCode" placeholder="追跡番号（例: AM123456）">
                <button class="btn" style="width:120px;" onclick="startTracking()">追跡する</button>
            </div>

            <div id="trackingResult" style="display: none;">
                <div class="result-card">
                    <div><strong>追跡番号：</strong> <span id="resCode"></span></div>
                    <div><strong>現在の状況：</strong> <span id="resStatus" class="status-badge"></span></div>
                    <div><strong>配達予定日：</strong> <span id="resDate"></span></div>

                    <div id="driverMsgBox" class="message-box" style="display: none;">
                        <strong>お知らせ：</strong> <span id="resMsg"></span>
                    </div>

                    <!-- 確認ボタン（配達完了時） -->
                    <button id="confirmDeliveredBtn" class="btn btn-gray" style="display:none;" onclick="confirmDelivered()">配達確認（履歴から削除）</button>
                </div>

                <!-- 各種通知・PDFエリア -->
                <div id="pdfArea" class="pdf-container" style="display: none;">
                    <div class="pdf-header" id="pdfTitle">ご不在連絡票（電子版PDF）</div>
                    <div class="pdf-body" id="pdfBodyContent"></div>
                </div>

                <div class="timeline" id="timelineArea"></div>
            </div>

            <div id="trackingError" class="result-card" style="display: none; color: #dc2626;">
                該当の追跡番号は見つかりませんでした。
            </div>
        </div>

        <!-- 発送申し込みタブ -->
        <div id="tab-ship" class="tab-content">
            <h2>荷物の発送申し込み</h2>
            <form onsubmit="handleShipSubmit(event)">
                <div class="form-group">
                    <label>品名</label>
                    <input type="text" id="shipItemName" placeholder="例: 書類、服など" required>
                </div>
                <div class="form-group">
                    <label>お届け先 住所</label>
                    <input type="text" id="shipAddress" placeholder="例: 神奈川県横浜市..." required>
                </div>
                <button type="submit" class="btn">発送手続き（保護QR発行）</button>
            </form>

            <div id="shipResult" style="display: none; margin-top:2rem;">
                <h3>持込受付用QRコード</h3>
                <div class="qr-box">
                    <img id="qrImage" src="" alt="発送受付QR">
                </div>
                <p>■ 割り当て追跡コード: <strong id="resGeneratedCode"></strong></p>
            </div>
        </div>
    </div>

    <script>
        const SPREADSHEET_ID = '178-dcD4xd0fUdEORnoC9haQrKmfGiKTaY0OxiOKBRrQ';
        const gvizUrl = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json`;
        const SECRET_KEY = 5;

        // 1〜5のステータスマスター
        const statusMaster = {
            1: "営業所保管中",
            2: "輸送中",
            3: "配達店到着",
            4: "配達中",
            5: "配達済み"
        };

        let currentCode = null;
        let timer = null;

        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
            document.getElementById('nav-' + tabName).classList.add('active');
        }

        function formatDate(d) {
            return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
        }

        /* 予定日の動的計算 */
        function calcDeliveryDate(statusNum) {
            const now = new Date();
            if (statusNum === 5) return "配達完了";

            // ステータス3（配達店到着）の場合：13時前なら当日、13時以降なら翌日
            if (statusNum === 3) {
                if (now.getHours() < 13) {
                    return `${formatDate(now)} (本日お届け予定)`;
                } else {
                    const tomorrow = new Date(now); tomorrow.setDate(now.getDate() + 1);
                    return `${formatDate(tomorrow)} (明日お届け予定)`;
                }
            }

            // その他（1〜2日後）
            const d1 = new Date(now); d1.setDate(now.getDate() + 1);
            const d2 = new Date(now); d2.setDate(now.getDate() + 3);
            return `${formatDate(d1)} 〜 ${formatDate(d2)}`;
        }

        async function fetchSpreadsheetData() {
            try {
                const res = await fetch(gvizUrl + "&t=" + new Date().getTime());
                const text = await res.text();
                const jsonText = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
                return JSON.parse(jsonText).table.rows;
            } catch (err) {
                return null;
            }
        }

        async function syncAndRender() {
            if (!currentCode) return;

            // ローカル削除チェック（2日経過または確認済み）
            const history = JSON.parse(localStorage.getItem('tracking_history') || '{}');
            if (history[currentCode] && history[currentCode].deleted) {
                document.getElementById('trackingResult').style.display = "none";
                document.getElementById('trackingError').style.display = "block";
                return;
            }

            const rows = await fetchSpreadsheetData();
            if (!rows) return;

            let foundItem = null;
            rows.forEach(row => {
                const c = row.c;
                if (c && c[0] && c[0].v) {
                    const code = String(c[0].v).trim().toUpperCase();
                    if (code === currentCode) {
                        let bVal = 1;
                        if (c[1] && c[1].v !== null && c[1].v !== "") {
                            const parsed = parseInt(c[1].v, 10);
                            if (!isNaN(parsed)) bVal = parsed;
                        }
                        let cVal = (c[2] && c[2].v !== null) ? String(c[2].v) : "";
                        foundItem = { b: bVal, c: cVal };
                    }
                }
            });

            if (!foundItem) {
                document.getElementById('trackingResult').style.display = "none";
                document.getElementById('trackingError').style.display = "block";
                return;
            }

            document.getElementById('trackingError').style.display = "none";
            document.getElementById('trackingResult').style.display = "block";

            const statusNum = Math.min(Math.max(foundItem.b, 1), 5); // 1~5の範囲に固定
            const statusText = statusMaster[statusNum];
            const msg = foundItem.c;

            document.getElementById('resCode').innerText = currentCode;
            document.getElementById('resStatus').innerText = statusText;
            document.getElementById('resDate').innerText = calcDeliveryDate(statusNum);

            // 5（配達済み）の自動削除タイマー処理（48時間経過で削除）
            if (statusNum === 5) {
                document.getElementById('confirmDeliveredBtn').style.display = "block";
                if (!history[currentCode]) {
                    history[currentCode] = { deliveredAt: new Date().getTime() };
                    localStorage.setItem('tracking_history', JSON.stringify(history));
                } else if (history[currentCode].deliveredAt) {
                    const diffHours = (new Date().getTime() - history[currentCode].deliveredAt) / (1000 * 60 * 60);
                    if (diffHours >= 48) {
                        confirmDelivered();
                        return;
                    }
                }
            } else {
                document.getElementById('confirmDeliveredBtn').style.display = "none";
            }

            // メッセージ & PDF条件判定
            const msgBox = document.getElementById('driverMsgBox');
            const pdfArea = document.getElementById('pdfArea');
            const pdfTitle = document.getElementById('pdfTitle');
            const pdfContent = document.getElementById('pdfBodyContent');

            if (msg.includes("サイズ問題")) {
                msgBox.style.display = "block";
                msgBox.innerText = "サイズオーバーのため、返送致します。";
                pdfArea.style.display = "block";
                pdfTitle.innerText = "返送通知書（サイズ規定オーバー）";
                pdfContent.innerHTML = `
                    お荷物（<b>${currentCode}</b>）は規定サイズを超えているため、差出人様へ返送手続きを行っております。
                    <div class="stamp-area">
                        <div>受付店舗：通販サイト窓口</div>
                        <div class="hanko">大和</div>
                    </div>`;
            } else if (msg.includes("宛先問題")) {
                msgBox.style.display = "block";
                msgBox.innerText = "住所不明等の理由により、現在発送できておりません。営業所で保管中です。";
                pdfArea.style.display = "block";
                pdfTitle.innerText = "発送保留通知";
                pdfContent.innerHTML = `
                    お荷物（<b>${currentCode}</b>）は宛先不備のため営業所にて保管中です。
                    <button class="btn btn-red" onclick="requestReturn()">返送手続きを実行する</button>`;
            } else if (msg.includes("不在") || msg.includes("ご不在")) {
                msgBox.style.display = "none";
                pdfArea.style.display = "block";
                pdfTitle.innerText = "ご不在連絡票（電子版PDF）";
                pdfContent.innerHTML = `
                    お荷物（<b>${currentCode}</b>）はご不在のため持ち戻りいたしました。
                    <div class="reason-box">
                        <strong>【持ち戻り理由】</strong><br>
                        （ 〇 ） ご不在<br>
                        （ ） 住所不明<br>
                        （ ） 受取辞退
                    </div>
                    <button class="btn btn-red" onclick="alert('再配達を承りました。')">再配達を依頼する</button>`;
            } else {
                msgBox.style.display = msg ? "block" : "none";
                if (msg) msgBox.innerText = msg;
                pdfArea.style.display = "none";
            }

            // タイムライン描画 (1〜5)
            let html = "";
            for (let i = 1; i <= 5; i++) {
                let cls = (i < statusNum) ? "timeline-item done" : (i === statusNum) ? "timeline-item current" : "timeline-item";
                html += `<div class="${cls}">Step ${i}: ${statusMaster[i]}</div>`;
            }
            document.getElementById('timelineArea').innerHTML = html;
        }

        function requestReturn() {
            alert("返送リクエストを受け付けました。差出人様へのお手配を開始します。");
        }

        function confirmDelivered() {
            const history = JSON.parse(localStorage.getItem('tracking_history') || '{}');
            history[currentCode] = { deleted: true };
            localStorage.setItem('tracking_history', JSON.stringify(history));
            alert("配達確認が完了しました。この履歴を削除します。");
            document.getElementById('trackingResult').style.display = "none";
        }

        function startTracking() {
            const input = document.getElementById('trackingCode').value.trim().toUpperCase();
            if (!input) return;
            currentCode = input;
            syncAndRender();
            if (timer) clearInterval(timer);
            timer = setInterval(syncAndRender, 2000);
        }

        /* 暗号化機能付き発送申込 (AMから始まりB・C欄が空のコードを取得) */
        async function handleShipSubmit(e) {
            e.preventDefault();
            const itemName = document.getElementById('shipItemName').value.trim();
            const address = document.getElementById('shipAddress').value.trim();

            const rows = await fetchSpreadsheetData();
            let allocatedCode = null;

            if (rows) {
                for (let row of rows) {
                    const c = row.c;
                    if (c && c[0] && c[0].v) {
                        const codeStr = String(c[0].v).trim().toUpperCase();
                        // AMから始まり、B欄・C欄が空白のものを取得
                        if (codeStr.startsWith("AM")) {
                            const hasB = c[1] && c[1].v !== null && c[1].v !== "";
                            const hasC = c[2] && c[2].v !== null && c[2].v !== "";
                            if (!hasB && !hasC) {
                                allocatedCode = codeStr;
                                break;
                            }
                        }
                    }
                }
            }

            if (!allocatedCode) {
                allocatedCode = "AM" + Math.floor(100000 + Math.random() * 900000);
            }

            const rawDetails = `[大和運輸 伝票]\n追跡番号: ${allocatedCode}\n品名: ${itemName}\n住所: ${address}`;
            
            // シフト暗号化
            let base64 = btoa(unescape(encodeURIComponent(rawDetails)));
            let encryptedStr = "YAMATO_SEC::";
            for (let i = 0; i < base64.length; i++) {
                encryptedStr += String.fromCharCode(base64.charCodeAt(i) + SECRET_KEY);
            }

            const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(encryptedStr)}`;

            document.getElementById('resGeneratedCode').innerText = allocatedCode;
            document.getElementById('qrImage').src = qrApiUrl;
            document.getElementById('shipResult').style.display = "block";
        }
    </script>
</body>
</html>
